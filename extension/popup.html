<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nano翻譯官</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <section class="reading" aria-label="此頁閱讀工具">
      <p class="eyebrow">此頁閱讀 <span>EN / JA → 繁中</span></p>
      <p id="pageStatus" role="status">正在檢查此頁…</p>
      <button id="toggle" class="btn primary" type="button" disabled><span id="toggleLabel">翻譯此頁</span><span aria-hidden="true">↗</span></button>
      <button id="summary" class="btn secondary" type="button" disabled><span>產生重點摘要</span><span aria-hidden="true">≡</span></button>
      <div class="capabilities"><span id="translationState">翻譯 · 檢查中</span><span id="summaryState">摘要 · 檢查中</span></div>
    </section>
    <fieldset class="mode" disabled id="modeField">
      <legend>閱讀方式</legend>
      <div class="segments">
        <label><input type="radio" name="mode" value="bilingual" id="keep" checked><span>雙語對照</span></label>
        <label><input type="radio" name="mode" value="translation"><span>只看譯文</span></label>
      </div>
      <p id="keepHint" class="hint">原文與譯文一起閱讀</p>
    </fieldset>
    <section class="preferences" aria-label="自動化設定">
      <label class="row" for="hover"><span><strong>滑鼠停留翻譯</strong><small>未翻譯此頁時，指向文字區塊彈出譯文</small></span><span class="switch"><input type="checkbox" id="hover" disabled><span class="slider"></span></span></label>
      <label class="row" for="auto"><span><strong>自動翻譯新頁面</strong><small>載入英文、日文頁面時啟動</small></span><span class="switch"><input type="checkbox" id="auto" disabled><span class="slider"></span></span></label>
    </section>
    <p id="msg" class="msg" role="alert" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
