<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Nano翻譯官</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <button id="toggle" class="btn primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.9 15l-2.5-2.5c1.7-1.9 3-4.1 3.6-6.5H17V4h-7V2H8v2H1v2h11.2c-.6 1.8-1.6 3.5-2.9 5-.9-1-1.6-2-2.2-3H5.1c.7 1.5 1.6 2.9 2.7 4.2L2.9 17.1 4.3 18.5 9.3 13.5l3.1 3.1.5-1.6zM18.5 10h-2L12 22h2l1.1-3h4.8l1.1 3h2l-4.5-12zm-2.6 7l1.6-4.3 1.6 4.3h-3.2z"/></svg>
      <span id="toggleLabel">翻譯此頁</span>
    </button>

    <label class="row" for="keep">
      <span class="row-text">
        <strong>保留原文</strong>
        <small id="keepHint">雙語對照顯示</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="keep">
        <span class="slider"></span>
      </span>
    </label>

    <label class="row" for="auto">
      <span class="row-text">
        <strong>自動翻譯新頁面</strong>
        <small>開啟的新分頁、彈出視窗自動翻譯</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="auto">
        <span class="slider"></span>
      </span>
    </label>

    <label class="row" for="yt">
      <span class="row-text">
        <strong>YouTube 雙語字幕</strong>
        <small>開啟 CC 後，在原字幕下方加譯文</small>
      </span>
      <span class="switch">
        <input type="checkbox" id="yt">
        <span class="slider"></span>
      </span>
    </label>

    <button id="summary" class="btn secondary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>
      <span>產生重點摘要</span>
    </button>
    <p id="msg" class="msg" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
